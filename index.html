<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HAZARD 7007 // ULTIMATE VIBE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #0d121d 0%, #040507 75%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
      position: relative;
    }

    .windshield-glow {
      position: fixed;
      top: -15%;
      left: 0;
      width: 100%;
      height: 55%;
      pointer-events: none;
      z-index: 0;
      transition: background 0.04s linear;
    }

    .lightbar {
      width: 100%;
      max-width: 430px;
      height: 20px;
      background: rgba(10, 12, 18, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      display: grid;
      grid-template-columns: 1fr 0.35fr 1fr;
      gap: 6px;
      padding: 3px;
      margin-bottom: 12px;
      z-index: 2;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85);
    }

    .bar-red, .bar-white, .bar-blue {
      border-radius: 6px;
      opacity: 0.12;
      transition: opacity 0.025s linear, box-shadow 0.025s linear;
    }

    .bar-red { background: #ff1e38; }
    .bar-white { background: #ffffff; }
    .bar-blue { background: #0088ff; }

    .bar-red.flash { opacity: 1; box-shadow: 0 0 28px #ff1e38, 0 0 65px rgba(255, 30, 56, 0.7); }
    .bar-white.flash { opacity: 1; box-shadow: 0 0 25px #ffffff, 0 0 55px rgba(255, 255, 255, 0.8); }
    .bar-blue.flash { opacity: 1; box-shadow: 0 0 28px #0088ff, 0 0 65px rgba(0, 136, 255, 0.7); }

    .hazard-deck {
      width: 100%;
      max-width: 430px;
      background: linear-gradient(165deg, rgba(26, 30, 40, 0.94), rgba(11, 13, 18, 0.99));
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 26px;
      padding: 18px;
      z-index: 2;
      box-shadow:
        0 32px 70px rgba(0, 0, 0, 0.92),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      transition: transform 0.04s ease;
    }

    .hazard-deck.kick {
      transform: translateY(2px) scale(0.994);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .logo span:first-child {
      display: block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #64748b;
    }

    .logo span:last-child {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffffff, #ffb703);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .telemetry-pills {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .volt-pill, .status-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: 800;
      color: #94a3b8;
    }

    .volt-pill { color: #38bdf8; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #334155;
      transition: 0.15s;
    }

    .dot.live {
      background: #10b981;
      box-shadow: 0 0 12px #10b981;
    }

    .oled {
      background: #030406;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 16px;
      box-shadow: inset 0 6px 22px rgba(0, 0, 0, 0.96);
    }

    .oled-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .oled-mode {
      font-family: 'Courier New', monospace;
      font-size: 25px;
      font-weight: 900;
      color: #10b981;
      text-shadow: 0 0 14px rgba(16, 185, 129, 0.5);
    }

    .oled-hz {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #ffb703;
    }

    .oled-sub {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #475569;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    canvas#scope {
      width: 100%;
      height: 40px;
      display: block;
    }

    .modes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .mode-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 4px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.7px;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .mode-btn:active { transform: scale(0.95); }

    .mode-btn.active {
      background: rgba(255, 183, 3, 0.15);
      border-color: #ffb703;
      color: #ffffff;
      box-shadow: 0 0 18px rgba(255, 183, 3, 0.25);
    }

    .mode-btn[data-m="OFF"].active {
      background: rgba(255, 255, 255, 0.08);
      border-color: #64748b;
      box-shadow: none;
    }

    .big-pads {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .pad {
      height: 84px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(180deg, #242936 0%, #13161e 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 8px 0 #080a0d, 0 14px 25px rgba(0, 0, 0, 0.65);
      transition: transform 0.04s ease, box-shadow 0.04s ease;
    }

    .pad strong { font-size: 16px; font-weight: 900; letter-spacing: 1px; }
    .pad small { font-size: 10px; color: #64748b; font-weight: 700; }

    .pad.horn { border-color: rgba(255, 30, 56, 0.45); }
    .pad.horn.down {
      transform: translateY(5px);
      background: linear-gradient(180deg, #5e111c 0%, #2b070c 100%);
      border-color: #ff1e38;
      box-shadow: 0 3px 0 #080a0d, 0 0 32px rgba(255, 30, 56, 0.6);
    }

    .pad.manual { border-color: rgba(0, 136, 255, 0.45); }
    .pad.manual.down {
      transform: translateY(5px);
      background: linear-gradient(180deg, #0e3a6b 0%, #071d36 100%);
      border-color: #0088ff;
      box-shadow: 0 3px 0 #080a0d, 0 0 32px rgba(0, 136, 255, 0.6);
    }

    .tools-row {
      display: grid;
      grid-template-columns: 1fr 1fr 0.7fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tool-btn {
      padding: 12px 6px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.14s;
    }

    .tool-btn.on-ptt {
      background: rgba(255, 30, 56, 0.22);
      border-color: #ff1e38;
      color: #ff8fa3;
      box-shadow: 0 0 20px rgba(255, 30, 56, 0.4);
    }

    .tool-btn.on-strobe {
      background: rgba(0, 136, 255, 0.22);
      border-color: #0088ff;
      color: #7cc4ff;
      box-shadow: 0 0 20px rgba(0, 136, 255, 0.4);
    }

    .tool-btn.on-flash-horn {
      background: rgba(255, 183, 3, 0.2);
      border-color: #ffb703;
      color: #fde047;
    }

    .gain-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .gain-box span {
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      background: #1e293b;
      border-radius: 5px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffb703;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 183, 3, 0.85);
    }
  </style>
</head>
<body>

  <div class="windshield-glow" id="windshieldGlow"></div>

  <div class="lightbar">
    <div class="bar-red" id="barRed"></div>
    <div class="bar-white" id="barWhite"></div>
    <div class="bar-blue" id="barBlue"></div>
  </div>

  <div class="hazard-deck" id="deck">
    <div class="top-bar">
      <div class="logo">
        <span>PREMIER HAZARD</span>
        <span>7007 // ULTIMATE</span>
      </div>
      <div class="telemetry-pills">
        <div class="volt-pill" id="voltMeter">14.2V</div>
        <div class="status-chip">
          <div class="dot" id="led"></div>
          <span id="sysState">OFF</span>
        </div>
      </div>
    </div>

    <div class="oled">
      <div class="oled-top">
        <div class="oled-mode" id="oledMode">OFF</div>
        <div class="oled-hz" id="oledHz">0 Hz</div>
      </div>
      <div class="oled-sub">
        <span id="strobeModeLabel">STROBE: OFF</span>
        <span>DUAL HORN DSP 2x800W</span>
      </div>
      <canvas id="scope"></canvas>
    </div>

    <div class="modes-grid">
      <button class="mode-btn active" data-m="OFF">OFF</button>
      <button class="mode-btn" data-m="WAIL">WAIL</button>
      <button class="mode-btn" data-m="YELP">YELP</button>
      <button class="mode-btn" data-m="HI-LO">HI-LO</button>
      <button class="mode-btn" data-m="PIERCER">PIERCER</button>
      <button class="mode-btn" data-m="PHASER">PHASER</button>
    </div>

    <div class="big-pads">
      <button class="pad horn" id="padHorn">
        <strong>AIR HORN</strong>
        <small>КРЯКАЛКА [HOLD]</small>
      </button>
      <button class="pad manual" id="padManual">
        <strong>MANUAL</strong>
        <small>НАКАТ [HOLD]</small>
      </button>
    </div>

    <div class="tools-row">
      <button class="tool-btn" id="btnStrobe">STROBE: OFF</button>
      <button class="tool-btn on-flash-horn" id="btnHornFlash">HORN+FLASH</button>
      <button class="tool-btn" id="btnPtt">PTT</button>
    </div>

    <div class="gain-box">
      <span>GAIN</span>
      <input type="range" id="gainSlider" min="0" max="1" step="0.01" value="0.75" />
      <span id="gainVal">75%</span>
    </div>
  </div>

  <script>
    // Аудио-движок Premier Hazard 7007 (Web Audio API)
    let ctx = null;
    let osc1 = null, osc2 = null, masterGain = null, filterNode = null, analyser = null;
    let currentMode = 'OFF';
    let hornDown = false;
    let manualDown = false;
    let pttActive = false;
    let strobeMode = 0; // 0: OFF, 1: PATROL, 2: HYPER
    let hornFlash = true;
    let manualFreq = 350;
    let currentFreq = 0;
    let startTime = 0;

    // Элементы интерфейса
    const oledMode = document.getElementById('oledMode');
    const oledHz = document.getElementById('oledHz');
    const sysState = document.getElementById('sysState');
    const led = document.getElementById('led');
    const voltMeter = document.getElementById('voltMeter');
    const deck = document.getElementById('deck');
    const barRed = document.getElementById('barRed');
    const barWhite = document.getElementById('barWhite');
    const barBlue = document.getElementById('barBlue');
    const glow = document.getElementById('windshieldGlow');
    const strobeLabel = document.getElementById('strobeModeLabel');
    const btnStrobe = document.getElementById('btnStrobe');
    const btnHornFlash = document.getElementById('btnHornFlash');
    const btnPtt = document.getElementById('btnPtt');
    const gainSlider = document.getElementById('gainSlider');
    const gainVal = document.getElementById('gainVal');
    const scope = document.getElementById('scope');
    const sCtx = scope.getContext('2d');

    function initAudio() {
      if (!ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        ctx = new AudioCtx();

        osc1 = ctx.createOscillator();
        osc2 = ctx.createOscillator();
        osc1.type = 'sawtooth';
        osc2.type = 'square';

        filterNode = ctx.createBiquadFilter();
        filterNode.type = 'bandpass';
        filterNode.frequency.value = 950;
        filterNode.Q.value = 1.6;

        masterGain = ctx.createGain();
        masterGain.gain.value = 0;

        analyser = ctx.createAnalyser();
        analyser.fftSize = 256;

        const subGain2 = ctx.createGain();
        subGain2.gain.value = 0.45;

        osc1.connect(filterNode);
        osc2.connect(subGain2);
        subGain2.connect(filterNode);
        filterNode.connect(masterGain);
        masterGain.connect(analyser);
        analyser.connect(ctx.destination);

        osc1.start();
        osc2.start();
        startTime = ctx.currentTime;
      }
      if (ctx.state === 'suspended') {
        ctx.resume();
      }
    }

    // Переключение режимов сирены
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        initAudio();
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.m;
        startTime = ctx.currentTime;
      });
    });

    // Обработка нажатий Air Horn (Крякалка)
    const padHorn = document.getElementById('padHorn');
    const setHorn = (state) => {
      initAudio();
      hornDown = state;
      padHorn.classList.toggle('down', state);
      if (state) {
        deck.classList.add('kick');
        setTimeout(() => deck.classList.remove('kick'), 70);
      }
    };
    padHorn.addEventListener('pointerdown', (e) => { e.preventDefault(); setHorn(true); });
    window.addEventListener('pointerup', () => { if (hornDown) setHorn(false); });
    padHorn.addEventListener('pointerleave', () => { if (hornDown) setHorn(false); });

    // Обработка нажатий Manual (Накат)
    const padManual = document.getElementById('padManual');
    const setManual = (state) => {
      initAudio();
      manualDown = state;
      padManual.classList.toggle('down', state);
    };
    padManual.addEventListener('pointerdown', (e) => { e.preventDefault(); setManual(true); });
    window.addEventListener('pointerup', () => { if (manualDown) setManual(false); });
    padManual.addEventListener('pointerleave', () => { if (manualDown) setManual(false); });

    // Стробоскопы
    const strobeNames = ['OFF', 'PATROL', 'HYPER'];
    btnStrobe.addEventListener('click', () => {
      strobeMode = (strobeMode + 1) % 3;
      const name = strobeNames[strobeMode];
      btnStrobe.textContent = `STROBE: ${name}`;
      strobeLabel.textContent = `STROBE: ${name}`;
      btnStrobe.classList.toggle('on-strobe', strobeMode > 0);
    });

    // Вспышка при крякалке
    btnHornFlash.addEventListener('click', () => {
      hornFlash = !hornFlash;
      btnHornFlash.classList.toggle('on-flash-horn', hornFlash);
    });

    // Кнопка PTT (имитация тангенты - приглушает сирену)
    btnPtt.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      initAudio();
      pttActive = true;
      btnPtt.classList.add('on-ptt');
    });
    window.addEventListener('pointerup', () => {
      if (pttActive) {
        pttActive = false;
        btnPtt.classList.remove('on-ptt');
      }
    });

    // Громкость
    gainSlider.addEventListener('input', () => {
      gainVal.textContent = `${Math.round(gainSlider.value * 100)}%`;
    });

    // Главный цикл DSP и визуализации
    function loop() {
      const now = performance.now();
      let activeSound = false;
      let displayMode = currentMode;

      if (ctx) {
        const t = ctx.currentTime - startTime;
        const targetVol = parseFloat(gainSlider.value);

        if (pttActive) {
          displayMode = 'PA // PTT';
          currentFreq = 0;
          masterGain.gain.setTargetAtTime(0, ctx.currentTime, 0.02);
        } else if (hornDown) {
          // Характерный сухой двойной тон Premier Hazard 7007
          activeSound = true;
          displayMode = 'AIR HORN';
          const wobble = Math.sin(t * 95) * 18;
          currentFreq = 465 + wobble;
          osc1.frequency.setValueAtTime(currentFreq, ctx.currentTime);
          osc2.frequency.setValueAtTime(currentFreq * 1.49, ctx.currentTime);
          filterNode.frequency.setValueAtTime(1100, ctx.currentTime);
          masterGain.gain.setTargetAtTime(targetVol, ctx.currentTime, 0.012);
        } else if (manualDown) {
          activeSound = true;
          displayMode = 'MANUAL';
          manualFreq = Math.min(1380, manualFreq + 16);
          currentFreq = manualFreq;
          osc1.frequency.setValueAtTime(currentFreq, ctx.currentTime);
          osc2.frequency.setValueAtTime(currentFreq * 1.005, ctx.currentTime);
          filterNode.frequency.setValueAtTime(currentFreq * 1.3, ctx.currentTime);
          masterGain.gain.setTargetAtTime(targetVol, ctx.currentTime, 0.02);
        } else {
          if (manualFreq > 350) manualFreq = Math.max(350, manualFreq - 12);

          if (currentMode === 'WAIL') {
            activeSound = true;
            currentFreq = 820 + Math.sin(t * 1.35 - Math.PI / 2) * 440;
          } else if (currentMode === 'YELP') {
            activeSound = true;
            currentFreq = 880 + Math.sin(t * 19) * 420;
          } else if (currentMode === 'HI-LO') {
            activeSound = true;
            currentFreq = (Math.floor(t * 2.4) % 2 === 0) ? 780 : 585;
          } else if (currentMode === 'PIERCER') {
            activeSound = true;
            currentFreq = 950 + Math.sin(t * 48) * 380;
          } else if (currentMode === 'PHASER') {
            activeSound = true;
            currentFreq = 900 + ((t * 14) % 1) * 550;
          } else {
            currentFreq = 0;
          }

          if (activeSound) {
            osc1.frequency.setValueAtTime(currentFreq, ctx.currentTime);
            osc2.frequency.setValueAtTime(currentFreq * 1.004, ctx.currentTime);
            filterNode.frequency.setValueAtTime(Math.max(600, currentFreq * 1.4), ctx.currentTime);
            masterGain.gain.setTargetAtTime(targetVol * 0.85, ctx.currentTime, 0.025);
          } else {
            masterGain.gain.setTargetAtTime(0, ctx.currentTime, 0.025);
          }
        }
      }

      // Обновление OLED-дисплея и телеметрии
      oledMode.textContent = displayMode;
      oledHz.textContent = `${Math.round(currentFreq)} Hz`;
      const isLive = activeSound || strobeMode > 0 || pttActive;
      led.classList.toggle('live', isLive);
      sysState.textContent = isLive ? 'ACTIVE' : 'OFF';
      voltMeter.textContent = activeSound ? `${(13.8 - Math.random() * 0.3).toFixed(1)}V` : '14.2V';

      // Логика стробоскопов и подсветки лобового стекла
      let rOn = false, wOn = false, bOn = false;
      if (hornDown && hornFlash) {
        const pulse = Math.floor(now / 45) % 2 === 0;
        rOn = pulse;
        wOn = true;
        bOn = !pulse;
      } else if (strobeMode === 1) {
        const step = Math.floor(now / 90) % 6;
        rOn = (step === 0 || step === 2);
        bOn = (step === 3 || step === 5);
        wOn = (step === 1 && activeSound);
      } else if (strobeMode === 2) {
        const step = Math.floor(now / 45) % 4;
        rOn = step === 0;
        wOn = step === 1;
        bOn = step === 2;
      }

      barRed.classList.toggle('flash', rOn);
      barWhite.classList.toggle('flash', wOn);
      barBlue.classList.toggle('flash', bOn);

      if (rOn) {
        glow.style.background = 'radial-gradient(circle at 25% 10%, rgba(255,30,56,0.28), transparent 65%)';
      } else if (bOn) {
        glow.style.background = 'radial-gradient(circle at 75% 10%, rgba(0,136,255,0.28), transparent 65%)';
      } else if (wOn) {
        glow.style.background = 'radial-gradient(circle at 50% 10%, rgba(255,255,255,0.22), transparent 60%)';
      } else {
        glow.style.background = 'transparent';
      }

      // Отрисовка осциллографа
      drawScope(activeSound);
      requestAnimationFrame(loop);
    }

    function drawScope(active) {
      if (scope.width !== scope.clientWidth) {
        scope.width = scope.clientWidth;
        scope.height = scope.clientHeight;
      }
      const w = scope.width;
      const h = scope.height;
      sCtx.clearRect(0, 0, w, h);

      sCtx.strokeStyle = active ? '#10b981' : '#1e293b';
      sCtx.lineWidth = 2;
      sCtx.beginPath();

      if (active && analyser) {
        const data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteTimeDomainData(data);
        const slice = w / data.length;
        let x = 0;
        for (let i = 0; i < data.length; i++) {
          const v = data[i] / 128.0;
          const y = (v * h) / 2;
          if (i === 0) sCtx.moveTo(x, y);
          else sCtx.lineTo(x, y);
          x += slice;
        }
      } else {
        sCtx.moveTo(0, h / 2);
        sCtx.lineTo(w, h / 2);
      }
      sCtx.stroke();
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
